<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三餐转盘 · 今天吃什么外卖</title>
  <meta name="description" content="早餐、午餐、晚餐、夜宵不知道吃什么？转盘帮你随机抽取一个外卖，告别选择困难。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="title">三餐转盘</h1>
      <p class="subtitle">今天吃什么外卖？让转盘来决定</p>
    </header>

    <nav class="meals" role="tablist" aria-label="三餐选择">
      <button class="meal-tab is-active" data-meal="breakfast" role="tab" aria-selected="true">早餐</button>
      <button class="meal-tab" data-meal="lunch" role="tab" aria-selected="false">午餐</button>
      <button class="meal-tab" data-meal="dinner" role="tab" aria-selected="false">晚餐</button>
      <button class="meal-tab" data-meal="supper" role="tab" aria-selected="false">夜宵</button>
    </nav>

    <section class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="560" height="560"></canvas>
      <div class="wheel-center">
        <span class="wheel-center-meal">早餐</span>
        <span class="wheel-center-hint">点击开转</span>
      </div>
    </section>

    <div class="actions">
      <button id="spin-btn" class="btn btn-primary">开转！</button>
      <button id="add-btn" class="btn btn-ghost">＋ 加餐</button>
      <button id="settings-btn" class="btn btn-ghost btn-icon" title="页面设置" aria-label="页面设置">⚙️</button>
    </div>

    <section id="result" class="result is-hidden" aria-live="polite">
      <div class="result-card">
        <span class="result-badge">抽中</span>
        <h2 id="result-name" class="result-name"></h2>
        <p id="result-emoji" class="result-emoji"></p>
        <button id="spin-again" class="btn btn-secondary">再转一次</button>
      </div>
    </section>

    <section id="meal-list" class="meal-list">
      <h3 class="list-title">今日选项池</h3>
      <div id="list-body" class="list-body"></div>
    </section>

    <footer class="app-footer">
      <p>纯前端 · 选项保存在本地浏览器 · 数据不离开你的设备</p>
    </footer>
  </main>

  <dialog id="edit-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3 id="dialog-title">添加选项</h3>
      <input id="dialog-input" class="dialog-input" type="text" maxlength="12" placeholder="例如：麻辣香锅" autocomplete="off" />
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">取消</button>
        <button id="dialog-confirm" value="confirm" class="btn btn-primary">添加</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3>页面设置</h3>
      <label class="field">
        <span>主标题</span>
        <input id="set-title" class="dialog-input" type="text" maxlength="20" autocomplete="off" />
      </label>
      <label class="field">
        <span>副标题</span>
        <input id="set-subtitle" class="dialog-input" type="text" maxlength="40" autocomplete="off" />
      </label>
      <label class="field">
        <span>页脚文字</span>
        <input id="set-footer" class="dialog-input" type="text" maxlength="60" autocomplete="off" />
      </label>
      <div class="field">
        <span>分类名称</span>
        <div class="field-row">
          <input id="set-label-breakfast" class="dialog-input" type="text" maxlength="6" autocomplete="off" />
          <input id="set-label-lunch" class="dialog-input" type="text" maxlength="6" autocomplete="off" />
          <input id="set-label-dinner" class="dialog-input" type="text" maxlength="6" autocomplete="off" />
          <input id="set-label-supper" class="dialog-input" type="text" maxlength="6" autocomplete="off" />
        </div>
      </div>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">取消</button>
        <button id="settings-confirm" value="confirm" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=2"></script>
</body>
</html>
